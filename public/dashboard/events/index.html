<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Event — Gildia</title>
  <link rel="stylesheet" href="/landing.css?v=1" />
</head>
<body>
  <div class="container">
    <header style="display:flex;justify-content:space-between;align-items:center;padding:24px 0">
      <h1>Create new event package</h1>
      <a class="btn primary" href="/dashboard/index.html">Back to dashboard</a>
    </header>

    <section class="card">
      <h3>Event details</h3>
      <label class="pf-field"><span class="pf-field__label">Event name</span><input class="pf-input" placeholder="Tadbir nomi" /></label>
      <label class="pf-field"><span class="pf-field__label">Organization</span><input class="pf-input" placeholder="Tashkilot nomi" /></label>
      <label class="pf-field"><span class="pf-field__label">Date</span><input class="pf-input" type="date" /></label>
      <label class="pf-field"><span class="pf-field__label">Brand color</span><input class="pf-input" type="color" value="#0dd4b3" /></label>
      <div style="margin-top:12px"><a class="btn primary" href="/dashboard/events/event.html">Create workspace</a></div>
    </section>

  </div>
</body>
</html>
