<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bulk generate — Gildia</title>
  <link rel="stylesheet" href="/landing.css?v=1" />
</head>
<body>
  <div class="container">
    <header style="display:flex;justify-content:space-between;align-items:center;padding:18px 0">
      <h1>Excel orqali ommaviy yaratish</h1>
      <a class="btn" href="/dashboard/index.html">Back</a>
    </header>

    <section class="card">
      <h3>1. Select template</h3>
      <div class="pf-templates-list"></div>
      <h3 style="margin-top:12px">2. Upload XLSX / CSV</h3>
      <label class="pf-upload-card">
        <div class="pf-upload-card__icon"><svg class="pf-i"><use href="#pf-i-import" /></svg></div>
        <div class="pf-upload-card__body"><strong>Upload file</strong><span>Download sample template if needed</span></div>
        <input type="file" accept=".csv,.xlsx" />
      </label>
      <div style="margin-top:12px">
        <button class="btn primary">Map columns</button>
        <button class="btn">Preview</button>
        <button class="btn primary">Generate ZIP</button>
      </div>
      <p class="pf-hint" style="margin-top:8px">Note: Backend bulk generation endpoint integration required. This page is a frontend placeholder that demonstrates flow.</p>
    </section>
  </div>
</body>
</html>
